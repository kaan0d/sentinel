[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Packet analyzer and rule-based network IDS, written from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sentinel", "tools", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli.py" = ["E501"]  # golden output lines
